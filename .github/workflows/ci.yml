name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19

jobs:
  source-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit production sources
        run: |
          if grep -RInE '(^|[^[:alnum:]_])throw([^[:alnum:]_]|$)|std::abort[[:space:]]*\(' src; then
            echo "Embedded safety audit failed"
            exit 1
          fi

  host-contract:
    runs-on: ubuntu-latest
    needs: source-audit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compile and run placement contract
        run: |
          mkdir -p build
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Isrc \
            test/host/placement_contract_test.cpp \
            src/strata/Allocation.cpp \
            src/strata/Diagnostics.cpp \
            src/strata/internal/PlatformGeneric.cpp \
            src/strata/internal/PlatformEsp32.cpp \
            -o build/placement-contract-test
          ./build/placement-contract-test

      - name: Compile and run generic allocation contract
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Isrc \
            test/host/allocation_contract_test.cpp \
            src/strata/Allocation.cpp \
            src/strata/Diagnostics.cpp \
            src/strata/internal/PlatformGeneric.cpp \
            src/strata/internal/PlatformEsp32.cpp \
            -o build/allocation-contract-test
          ./build/allocation-contract-test

      - name: Compile and run generic diagnostics contract
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Isrc \
            test/host/diagnostics_contract_test.cpp \
            src/strata/Allocation.cpp \
            src/strata/Diagnostics.cpp \
            src/strata/internal/PlatformGeneric.cpp \
            src/strata/internal/PlatformEsp32.cpp \
            -o build/diagnostics-contract-test
          ./build/diagnostics-contract-test

      - name: Compile and run typed ownership contract
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -Isrc \
            test/host/typed_contract_test.cpp \
            src/strata/Allocation.cpp \
            src/strata/Diagnostics.cpp \
            src/strata/internal/PlatformGeneric.cpp \
            src/strata/internal/PlatformEsp32.cpp \
            -o build/typed-contract-test
          ./build/typed-contract-test

      - name: Compile and run ESP32 allocation backend contract
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -DESP32 \
            -Itest/host/fakes \
            -Isrc \
            test/host/esp32_allocation_backend_test.cpp \
            src/strata/Allocation.cpp \
            src/strata/Diagnostics.cpp \
            src/strata/internal/PlatformEsp32.cpp \
            -o build/esp32-allocation-backend-test
          ./build/esp32-allocation-backend-test

      - name: Compile and run ESP32 diagnostics backend contract
        run: |
          g++ -std=c++20 -Wall -Wextra -Wpedantic -Werror \
            -DESP32 \
            -Itest/host/fakes \
            -Isrc \
            test/host/esp32_diagnostics_backend_test.cpp \
            src/strata/Allocation.cpp \
            src/strata/Diagnostics.cpp \
            src/strata/internal/PlatformEsp32.cpp \
            -o build/esp32-diagnostics-backend-test
          ./build/esp32-diagnostics-backend-test

  build-example:
    runs-on: ubuntu-latest
    needs: source-audit
    strategy:
      fail-fast: false
      matrix:
        board: [esp32dev, esp32-s3-devkitc-1, esp32-c3-devkitm-1, esp32-p4-evboard]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache PIOArduino
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-${{ hashFiles('**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-

      - name: Install PIOArduino Core
        run: python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"

      - name: Install PIOArduino ESP32 Platform
        run: pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"

      - name: Build Placement example
        run: |
          pio ci examples/Placement \
            --board ${{ matrix.board }} \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"

      - name: Build Allocation example
        run: |
          pio ci examples/Allocation \
            --board ${{ matrix.board }} \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"

      - name: Build Diagnostics example
        run: |
          pio ci examples/Diagnostics \
            --board ${{ matrix.board }} \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"

      - name: Build TypedOwnership example
        run: |
          pio ci examples/TypedOwnership \
            --board ${{ matrix.board }} \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20"
