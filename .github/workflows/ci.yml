name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: strata-${{ github.ref }}
  cancel-in-progress: false

env:
  PIOARDUINO_PLATFORM_URL: https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
  PIOARDUINO_PLATFORM_VERSION: 55.03.39
  PIOARDUINO_VERSION: 6.1.19

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate release metadata
        run: python3 scripts/validate_release_version.py

  source-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Audit ZekStack dependency boundary
        run: |
          if grep -RInE '#include[[:space:]]+[<"](Accord|Curier|Flow|Fresh|Link|Lingo|Phase|Pulse|Seal|Signal|Tempo|Trace|Worker)\.h[>"]' src; then
            echo "Strata must not depend on another ZekStack library"
            exit 1
          fi

      - name: Audit core public header boundary
        run: |
          core_headers="src/Strata.h $(find src/strata -maxdepth 1 -type f -name '*.h' -print)"
          if grep -InE 'freertos/|ArduinoJson|memory_resource|MALLOC_CAP_|esp_heap|esp_memory|FreeRTOS|ESP32' $core_headers; then
            echo "Core public headers must remain platform and optional-integration neutral"
            exit 1
          fi

      - name: Audit production failure policy
        run: |
          violations="$(grep -RInE '(^|[^[:alnum:]_])throw([^[:alnum:]_]|$)|std::abort[[:space:]]*\(|std::terminate[[:space:]]*\(|(^|[^[:alnum:]_:])abort[[:space:]]*\(' src || true)"
          violations="$(printf '%s\n' "$violations" | grep -v 'src/strata/Allocator.h:.*throw std::bad_alloc' || true)"
          if [ -n "$violations" ]; then
            printf '%s\n' "$violations"
            echo "Embedded safety audit failed"
            exit 1
          fi

      - name: Audit allocator exception boundary
        run: |
          count="$(grep -c 'throw std::bad_alloc' src/strata/Allocator.h)"
          test "$count" -eq 1

      - name: Audit FreeRTOS mutex allocation boundary
        run: |
          if grep -RInE 'xSemaphoreCreateMutex[[:space:]]*\(|xSemaphoreCreateRecursiveMutex[[:space:]]*\(' src; then
            echo "Strata mutex wrappers must use static FreeRTOS creation APIs"
            exit 1
          fi

  host-tests:
    runs-on: ubuntu-latest
    needs: source-audit
    steps:
      - uses: actions/checkout@v4
      - name: Build and run host contracts
        run: |
          set -e
          mkdir -p build
          common_sources="src/strata/Allocation.cpp src/strata/Diagnostics.cpp src/strata/internal/PlatformGeneric.cpp src/strata/internal/PlatformEsp32.cpp"
          common_flags="-std=c++20 -Wall -Wextra -Wpedantic -Werror -Isrc"

          g++ $common_flags tests/host/public_api_stability_contract_test.cpp $common_sources -o build/public-api-stability-contract-test
          ./build/public-api-stability-contract-test

          g++ $common_flags tests/host/memory_policy_contract_test.cpp $common_sources -o build/memory-policy-contract-test
          ./build/memory-policy-contract-test

          g++ $common_flags -fno-exceptions tests/host/core_no_exceptions_contract_test.cpp $common_sources -o build/core-no-exceptions-contract-test
          ./build/core-no-exceptions-contract-test

          g++ $common_flags tests/host/placement_contract_test.cpp $common_sources -o build/placement-contract-test
          ./build/placement-contract-test

          g++ $common_flags tests/host/allocation_contract_test.cpp $common_sources -o build/allocation-contract-test
          ./build/allocation-contract-test

          g++ $common_flags tests/host/diagnostics_contract_test.cpp $common_sources -o build/diagnostics-contract-test
          ./build/diagnostics-contract-test

          g++ $common_flags -DSTRATA_ENABLE_ADVANCED_DIAGNOSTICS=1 tests/host/advanced_diagnostics_contract_test.cpp $common_sources -o build/advanced-diagnostics-contract-test
          ./build/advanced-diagnostics-contract-test

          g++ $common_flags tests/host/typed_contract_test.cpp $common_sources -o build/typed-contract-test
          ./build/typed-contract-test

          g++ $common_flags tests/host/stl_allocator_contract_test.cpp $common_sources -o build/stl-allocator-contract-test
          ./build/stl-allocator-contract-test

          g++ $common_flags -fno-exceptions tests/host/stl_allocator_no_exceptions_contract_test.cpp $common_sources -o build/stl-allocator-no-exceptions-contract-test
          ./build/stl-allocator-no-exceptions-contract-test

          g++ $common_flags tests/host/buffer_contract_test.cpp $common_sources -o build/buffer-contract-test
          ./build/buffer-contract-test

          g++ $common_flags tests/host/capability_contract_test.cpp $common_sources -o build/capability-contract-test
          ./build/capability-contract-test

          g++ $common_flags -Itests/host/freertos_fakes tests/host/freertos_task_contract_test.cpp $common_sources -o build/freertos-task-contract-test
          ./build/freertos-task-contract-test

          g++ $common_flags -Itests/host/freertos_fakes tests/host/freertos_queue_contract_test.cpp $common_sources -o build/freertos-queue-contract-test
          ./build/freertos-queue-contract-test

          g++ $common_flags -Itests/host/freertos_fakes tests/host/freertos_mutex_contract_test.cpp $common_sources -o build/freertos-mutex-contract-test
          ./build/freertos-mutex-contract-test

          g++ $common_flags -Itests/host/arduinojson_fakes tests/host/arduinojson_allocator_contract_test.cpp $common_sources -o build/arduinojson-allocator-contract-test
          ./build/arduinojson-allocator-contract-test

          g++ $common_flags tests/host/pmr_memory_resource_contract_test.cpp $common_sources -o build/pmr-memory-resource-contract-test
          ./build/pmr-memory-resource-contract-test

      - name: Build and run ESP32 backend contracts
        run: |
          set -e
          mkdir -p build
          flags="-std=c++20 -Wall -Wextra -Wpedantic -Werror -DESP32 -Itests/host/fakes -Isrc"
          sources="src/strata/Allocation.cpp src/strata/Diagnostics.cpp src/strata/internal/PlatformEsp32.cpp"

          g++ $flags tests/host/esp32_allocation_backend_test.cpp $sources -o build/esp32-allocation-backend-test
          ./build/esp32-allocation-backend-test

          g++ $flags tests/host/esp32_diagnostics_backend_test.cpp $sources -o build/esp32-diagnostics-backend-test
          ./build/esp32-diagnostics-backend-test

          g++ $flags -DSTRATA_ENABLE_ADVANCED_DIAGNOSTICS=1 tests/host/esp32_advanced_diagnostics_backend_test.cpp $sources -o build/esp32-advanced-diagnostics-backend-test
          ./build/esp32-advanced-diagnostics-backend-test

          g++ $flags tests/host/esp32_buffer_backend_test.cpp $sources -o build/esp32-buffer-backend-test
          ./build/esp32-buffer-backend-test

          g++ $flags tests/host/esp32_capability_backend_test.cpp $sources -o build/esp32-capability-backend-test
          ./build/esp32-capability-backend-test

          g++ $flags -Itests/host/freertos_fakes tests/host/esp32_freertos_task_backend_test.cpp $sources -o build/esp32-freertos-task-backend-test
          ./build/esp32-freertos-task-backend-test

          g++ $flags -Itests/host/freertos_fakes tests/host/esp32_freertos_queue_backend_test.cpp $sources -o build/esp32-freertos-queue-backend-test
          ./build/esp32-freertos-queue-backend-test

          g++ $flags -Itests/host/freertos_fakes tests/host/esp32_freertos_mutex_backend_test.cpp $sources -o build/esp32-freertos-mutex-backend-test
          ./build/esp32-freertos-mutex-backend-test

          g++ $flags -Itests/host/arduinojson_fakes tests/host/esp32_arduinojson_allocator_backend_test.cpp $sources -o build/esp32-arduinojson-allocator-backend-test
          ./build/esp32-arduinojson-allocator-backend-test

          g++ $flags tests/host/esp32_pmr_memory_resource_backend_test.cpp $sources -o build/esp32-pmr-memory-resource-backend-test
          ./build/esp32-pmr-memory-resource-backend-test

  build-examples:
    runs-on: ubuntu-latest
    needs: [source-audit, host-tests]
    strategy:
      fail-fast: false
      matrix:
        board:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-p4-evboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore PIOArduino cache
        id: pioarduino-cache
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-${{ hashFiles('**/library.json') }}
          restore-keys: |
            ${{ runner.os }}-pioarduino-${{ env.PIOARDUINO_VERSION }}-${{ env.PIOARDUINO_PLATFORM_VERSION }}-
      - name: Install PIOArduino
        run: |
          python -m pip install --upgrade "pioarduino==${PIOARDUINO_VERSION}"
          pio pkg install -g -p "${PIOARDUINO_PLATFORM_URL}"
      - name: Build examples
        run: |
          set -e
          for sketch in examples/*; do
            pio ci "$sketch" \
              --board "${{ matrix.board }}" \
              --lib="." \
              --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
              --project-option "lib_deps=bblanchon/ArduinoJson@7.4.3" \
              --project-option "build_unflags=-std=gnu++11" \
              --project-option "build_flags=-std=gnu++20"
          done
      - name: Build with advanced diagnostics enabled
        run: |
          pio ci examples/Diagnostics \
            --board "${{ matrix.board }}" \
            --lib="." \
            --project-option "platform=${PIOARDUINO_PLATFORM_URL}" \
            --project-option "lib_deps=bblanchon/ArduinoJson@7.4.3" \
            --project-option "build_unflags=-std=gnu++11" \
            --project-option "build_flags=-std=gnu++20 -DSTRATA_ENABLE_ADVANCED_DIAGNOSTICS=1"
      - name: Save PIOArduino cache
        if: matrix.board == 'esp32dev' && steps.pioarduino-cache.outcome == 'success' && steps.pioarduino-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: ${{ steps.pioarduino-cache.outputs.cache-primary-key }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [metadata, source-audit, host-tests, build-examples]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 == "## " version {capture=1; next}
            capture && /^## / {exit}
            capture {print}
          ' CHANGELOG.md > /tmp/release-notes.md
          test -s /tmp/release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file /tmp/release-notes.md
